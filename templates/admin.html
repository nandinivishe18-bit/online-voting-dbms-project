<!DOCTYPE html>

<html>

<head>

    <title>Admin Dashboard</title>

</head>

<body>

    <nav>

        <h1>Admin Dashboard</h1>

        <a href="/">
            Home
        </a>

    </nav>

    <h2>Registered Students</h2>

    <table border="1">

        <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>PRN</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>Vote Status</th>

            </tr>

        </thead>

        <tbody>

            {% for s in students %}

            <tr>

                <td>{{s[0]}}</td>
                <td>{{s[1]}}</td>
                <td>{{s[2]}}</td>
                <td>{{s[3]}}</td>
                <td>{{s[4]}}</td>

                <td>

                    {% if s[6] == 1 %}

                        Voted

                    {% else %}

                        Not Voted

                    {% endif %}

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>

</html>
