<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Voter Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h2>Voter Registration</h2>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required>

            <input
                type="text"
                name="prn"
                placeholder="PRN No."
                required>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="text"
                name="mobile"
                placeholder="Mobile"
                required>

            <input
                type="number"
                name="age"
                placeholder="Age"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            <a href="/login" style="color: yellow;">
                Already registered? Login
            </a>
        </p>

    </div>

</body>

</html>
